<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet Dosage Forms | Living Presentation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ROLE SELECTION MODAL -->
    <div id="role-modal" class="modal-overlay active">
        <div class="modal-content">
            <h2>Welcome to the Tablet Guide</h2>
            <p>Please select your role to customize the experience:</p>
            <div class="btn-group">
                <button onclick="setRole('patient')" class="btn btn-patient">👤 I am a Patient</button>
                <button onclick="setRole('pharmacist')" class="btn btn-pharmacist">💊 I am a Pharmacist/Student</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <header>
        <nav>
            <div class="logo">TabGuide</div>
            <div class="user-badge" id="user-badge">Guest</div>
            <button onclick="resetRole()" class="small-btn">Switch Role</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Dosage Forms III: Tablets</h1>
            <p>Interactive classification by Method of Preparation & Route of Administration.</p>
        </section>

        <!-- FILTERS/TABS -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Types</button>
            <button class="filter-btn" data-filter="compressed">Compressed</button>
            <button class="filter-btn" data-filter="coated">Coated/Special Release</button>
            <button class="filter-btn" data-filter="oral-cavity">Oral Cavity</button>
            <button class="filter-btn" data-filter="other-routes">Other Routes</button>
        </div>

        <!-- CONTENT GRID -->
        <div id="tablet-grid" class="grid-container">
            <!-- Cards will be injected here by JS -->
        </div>
    </main>

    <!-- DETAIL VIEW MODAL -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-large">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <div id="detail-content">
                <!-- Dynamic Content Here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
