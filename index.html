<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tabsense</title>

  <link rel="icon" type="image/png" href="./assets/images/pill.png" />
  <link rel="apple-touch-icon" href="./assets/images/pill.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ROLE SELECTION MODAL -->
  <div id="roleModal" class="overlay role-overlay">
    <div class="role-card">
      <div class="role-brand">
        <div class="role-orb icon-frame" data-fallback="T">
          <img
            src="./assets/images/pill.png"
            alt="Tabsense pill icon"
            class="icon-img"
            onerror="this.parentNode.classList.add('icon-missing');"
          />
        </div>

        <div class="role-brand-copy">
          <h1 class="role-title">Tabsense</h1>
          <p class="role-tagline">(Your portal to knowledge with just a click)</p>
        </div>
      </div>

      <p class="role-instruction">Select your viewing mode.</p>

      <div class="role-actions">
        <button class="role-btn role-btn-patient" onclick="setRole('patient')">
          <span class="role-icon icon-frame" data-fallback="P">
            <img
              src="./assets/images/patient.png"
              alt="Patient icon"
              class="icon-img"
              onerror="this.parentNode.classList.add('icon-missing');"
            />
          </span>
          <span class="role-text">
            <strong>Patient</strong>
          </span>
        </button>

        <button
          class="role-btn role-btn-pharmacist"
          onclick="setRole('pharmacist')"
        >
          <span class="role-icon icon-frame" data-fallback="Rx">
            <img
              src="./assets/images/pharmacist.png"
              alt="Pharmacist icon"
              class="icon-img"
              onerror="this.parentNode.classList.add('icon-missing');"
            />
          </span>
          <span class="role-text">
            <strong>Pharmacist / Student</strong>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <!-- SEARCH ENGINE STYLE CONSOLE -->
    <section id="searchConsole" class="search-console">
      <div class="search-console-inner">
        <div class="search-console-meta">
          <span id="roleBadge" class="role-badge">Select role</span>
          <button class="ghost-btn" onclick="resetRole()">Switch role</button>
        </div>

        <label class="sr-only" for="searchInput">
          Search drug, tablet type, route, excipient, manufacturer, or section title
        </label>

        <div class="search-box" id="searchBox">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>

          <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search drug, API, tablet type, excipient, manufacturer..."
          />

          <button
            id="clearSearch"
            class="clear-search"
            onclick="clearSearch()"
            aria-label="Clear search"
          >
            Clear
          </button>
        </div>
      </div>
    </section>

    <!-- TOOLBAR -->
    <section class="toolbar" id="toolbarSection">
      <div class="filters" id="filters"></div>
      <div class="count" id="resultCount"></div>
    </section>

    <!-- GRID -->
    <section id="grid" class="grid"></section>
  </main>

  <!-- DETAIL MODAL -->
  <div id="detailModal" class="overlay detail-overlay">
    <div class="detail-shell">
      <button class="close" onclick="closeDetail()" aria-label="Close">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>
      Replace placeholder videos by adding files under
      <code>assets/videos/</code>. Expected pattern:
      <code>&lt;drug-id&gt;_&lt;section-key&gt;.mp4</code>.
    </p>
  </footer>

  <script src="./data/tablets.js"></script>
  <script src="./app.js"></script>
</body>
</html>
